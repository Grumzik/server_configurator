title: Согласие
details: "Продолжая использовать наш сайт, вы даете согласие на обработку файлов cookie (пользовательских данных, содержащих сведения: \r\nо местоположении;\r\nтип, язык и версию ОС;\r\nтип, язык и версию браузера; \r\nсайт или рекламный сервис, с которого пришел пользователь; \r\nтип, язык и разрешение экрана устройства, с которого пользователь обращается к сайту; \r\nip-адрес, с которого пользователь обращается к сайту; сведения о взаимодействии пользователя с web-интерфейсом и службами сайта) в целях аутентификации пользователя на сайте, проведения ретаргетинга, статистических исследований и обзоров. \r\nЕсли вы не хотите, чтобы ваши данные обрабатывались, покиньте сайт."
