code: |-
  .tispage_fluid_image{
  	max-width: 100%; /* Картинка не будет больше, чем её контейнер */
    height: auto;     /* Сохраняет пропорции */
    display: block;   /* Убирает лишний отступ снизу */
  }


  .tispage_fixsize_image{
  	width: 100%;
    height: 350px;
    object-fit: cover; /* Растягивает картинку, заполняя весь контейнер, сохраняя пропорции и обрезая лишнее */
    object-position: center; /* Центрирует изображение в контейнере */
    display: block; /* Убирает пробел снизу картинки */
    
  }



