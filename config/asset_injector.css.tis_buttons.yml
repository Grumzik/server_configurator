  /* кнопки быстрой навигации*/
  .tis-btn{
  	font-size: 1.1rem;
  }


  .tis-btn__block, .tis-banner__buttons ul{
    display: flex;
    flex-wrap: wrap;
    gap: 2px calc(1rem - 10px);
    align-items: stretch; /* Выравнивание кнопок по высоте */

  }

  /* использовать для кнопок меню с сылками на табы!!!!*/
  .tis-btn-tabs{
    display: inline-flex; /* Flex контейнер для выравнивания текста по вертикали */
    align-items: center; /* Вертикальное выравнивание текста */
    flex-direction: column; /* Разрешить перенос текста */
    justify-content: center;
    padding: 10px 20px;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; /* Добавлена тень в transition */
    white-space: normal; /* Разрешить перенос текста */
    background-color: rgba(92,108,129,0.8);
    color: white; /* Белый текст */
    /*border: none; /* Убираем стандартную рамку */
    box-shadow: 0px 2px 4px rgba(255, 255, 255, 0.3); /* Светлая тень */
  }

  .tis-btn-tabs:hover {
    box-shadow: 0px 4px 8px rgba(255, 255, 255, 0.5); /* Увеличиваем тень при наведении */
  }
  /* использовать для кнопок меню с сылками на другие страницы*/
