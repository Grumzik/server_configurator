label: 'tis buttons'
code: |-
  .tis-menu-button {
    display: inline-block; /* или block, в зависимости от расположения кнопки */
    background-color: transparent; /* Цвет фона кнопки прозрачный */
    color: #ff820e;       /* Цвет текста */
    text-decoration: none; /* Убираем подчеркивание ссылки */
    border: 2.8px solid #ff820e;        /*  рамка*/
    border-radius: 30px; /* Закругленные углы */
    cursor: pointer;     /* Изменяем курсор на указатель */
    /* background-image: radial-gradient(circle, #fff, #ff820e); /* Начальный белый градиент */
    transition: background-image 2s ease-in-out; /* Плавный переход */
    transition: border-color 0.3s ease; /* Плавный переход цвета рамки при наведении */
    white-space: nowrap; /* Текст не переносится на новую строку */
  }
  .tis-menu-button:hover {
    background-color: #ff820e !important; /* Цвет фона при наведении */
    color: #fff !important;
  }


