  /* Контейнер для картинок (оставляем ваш текущий) */
  .certificate-image {
    position: relative;
    margin: 20px auto;
  }

  /* Общие стили для картинок (дополняем ваши) */
  .certificate-image li {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transition: transform 0.3s ease;
  }

  /* Первая картинка (главная) */
  .certificate-image li:nth-child(1) {
    z-index: 20;
    transform: translateY(0);
  }

  /* Вторая картинка */
  .certificate-image li:nth-child(2) {
    z-index: 15;
    transform: translateY(10px) translateX(10px); /* Смещение на 10px вниз и вправо */
  }

  /* Третья картинка */
  .certificate-image li:nth-child(3) {
    z-index: 10;
    transform: translateY(20px) translateX(20px); /* Смещение на 20px вниз и вправо */
  }

  /* Четвертая картинка */
  .certificate-image li:nth-child(4) {
    z-index: 5;
    transform: translateY(30px) translateX(30px); /* Смещение на 30px вниз и вправо */
  }

  /* Эффект при наведении (по желанию) */
  .certificate-image:hover li:nth-child(1) {
    transform: translateY(-5px); /* Легкий подъем верхней картинки */
  }
