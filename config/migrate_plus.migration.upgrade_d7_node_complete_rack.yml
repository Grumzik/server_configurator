uuid: bf721b47-a33e-4019-8bfd-dbad9c240e51
langcode: ru
status: true
dependencies: {  }
id: upgrade_d7_node_complete_rack
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (rack)'
source:
  plugin: d7_node_complete
  node_type: rack
process:
  nid:
    -
      plugin: get
      source: tnid
  vid:
    -
      plugin: get
      source: vid
  langcode:
    -
      plugin: default_value
      source: language
      default_value: und
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_rack/0/status:
    -
      plugin: get
      source: comment
  field_description:
    -
      plugin: get
      source: field_description
    -
      plugin: media_wysiwyg_filter
    -
      plugin: img_tag_to_embed
  field_image:
    -
      plugin: media_migration_delta_sort
      source: field_image
    -
      plugin: sub_process
      process:
        target_id:
          plugin: migration_lookup
          source: fid
          migration:
            - upgrade_d7_file_entity_image_public
            - upgrade_d7_file_entity_default_public
            - upgrade_d7_file_entity_video_public
          no_stub: true
  field_specification:
    -
      plugin: get
      source: field_specification
    -
      plugin: media_wysiwyg_filter
    -
      plugin: img_tag_to_embed
  field_adds:
    -
      plugin: sub_process
      source: field_adds
      process:
        target_id:
          -
            plugin: paragraphs_lookup
            tags: 'Field Collection Content'
            source: value
          -
            plugin: extract
            index:
              - id
        target_revision_id:
          -
            plugin: paragraphs_lookup
            tags:
              - 'Field Collection Revisions Content'
              - 'Field Collection Content'
            tag_ids:
              'Field Collection Revisions Content':
                - revision_id
              'Field Collection Content':
                - value
          -
            plugin: extract
            index:
              - revision_id
  field_metatag:
    -
      plugin: d7_metatag_entities
      source: pseudo_metatag_entities
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: rack
migration_dependencies:
  required:
    - upgrade_d7_user
    - upgrade_d7_node_type
    - upgrade_language
    - upgrade_d7_file_entity_image_public
    - upgrade_d7_field_collection_adds
    - upgrade_d7_field_collection_revisions_adds
    - upgrade_d7_file_entity_image_public
  optional:
    - upgrade_d7_field_instance
    - upgrade_d7_file_entity_default_public
    - upgrade_d7_file_entity_image_public
    - upgrade_d7_file_entity_video_public
    - upgrade_d7_file_entity_image_public
    - upgrade_d7_file_entity_default_public
    - upgrade_d7_file_entity_video_public
