  /* тест стилей*/

  /* 1. Делаем контейнер гибким (Flexbox) */
  .industry-section .icon-box-content {
      display: flex; /* Активируем Flexbox */
      align-items: center; /* Выравниваем элементы по центру по вертикали */
      gap: 20px; /* Добавляем отступ между иконкой и текстом */
      /* Можно добавить min-height, если содержимое может быть очень маленьким,
         чтобы блок не схлопывался, или чтобы все блоки были одинаковой высоты */
      /* min-height: 120px; */
  }

  /* 2. Стилизация контейнера для иконки (левая треть) */
  .industry-section .icon-box-content .highlight-icon {
      flex-basis: 10%; /* Занимает 20% ширины родителя */
      flex-shrink: 0; /* Запрещаем элементу сжиматься, если не хватает места */
      display: flex; /* Снова Flexbox, чтобы центрировать кружок внутри */
      justify-content: center; /* Центрируем по горизонтали */
      align-items: center; /* Центрируем по вертикали */
  }

  /* 3. Стилизация круга и его фона */
  .industry-section .icon-box-content .highlight-icon .icon-inner {
      background-color: white !important; /* Белый фон для круга. !important может понадобиться,
                                            если есть более специфичные стили темы. */
      border-radius: 50%; /* Делаем элемент круглым */
      overflow: hidden; /* Обрезаем все, что выходит за границы круга */
      display: flex; /* И снова Flexbox, чтобы центрировать само изображение внутри круга */
      justify-content: center;
      align-items: center;
      /* Определяем фиксированный размер для круга, чтобы он был квадратным перед закруглением. */
      /* Можно настроить этот размер под ваш дизайн. */
      width: 70px; /* Например, 100px */
      height: 70px; /* И 100px */
      padding: 15px; /* Небольшой отступ внутри круга, чтобы иконка не прилипала к краю */
      border: 1px solid #eee; /* Опционально: легкая серая рамка, если не устраивает i-border-theme */

      /* Могут быть конфликты с классами fa-stack, bg-theme, color-white, icon,
         если они имеют сильные стили для фона или размера.
         Если круг не получается или фон не меняется, возможно,
         придется переопределить стили этих классов или удалить их из HTML,
         если они не используются для Font Awesome и только мешают. */
  }

  /* 4. Стилизация изображения внутри круга */
  .industry-section .icon-box-content .highlight-icon .icon-inner img {
      display: block; /* Убираем возможный лишний пробел под изображением */
      max-width: 100%; /* Гарантируем, что изображение не выйдет за пределы своего родителя */
      max-height: 100%; /* Гарантируем, что изображение не выйдет за пределы своего родителя */
      object-fit: contain; /* Масштабирует изображение, чтобы оно поместилось в контейнер,
                               сохраняя пропорции и не обрезая. Если нужно заполнить круг,
                               обрезая части изображения, используйте 'cover'. */
      margin: 15px;                         
  }

  /* 5. Стилизация заголовка (правые две трети) */
  .industry-section .icon-box-content h2 {
      flex-basis: 80%; /* Занимает 70% ширины родителя */
      flex-grow: 1; /* Разрешаем элементу растягиваться, заполняя оставшееся пространство */
      margin: 0; /* Удаляем стандартные отступы у h2 для лучшего выравнивания */
      text-align: left; /* Убеждаемся, что текст выравнивается по левому краю внутри своей части */
  }


