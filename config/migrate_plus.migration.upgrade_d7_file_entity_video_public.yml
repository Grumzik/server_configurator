uuid: a7165854-e58d-4c46-92b2-a995f9460142
langcode: ru
status: true
dependencies: {  }
id: upgrade_d7_file_entity_video_public
class: Drupal\migrate\Plugin\Migration
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
  - 'Media Migration'
  - 'Media Entity'
migration_group: migrate_drupal_7
label: 'File Entity migration (Video)'
source:
  plugin: d7_file_entity_item
  type: video
  scheme: public
  types: video
  schemes: public
  destination_media_type_id: video
  source_field_name: field_media_video_file
  source_field_migration_id: 'd7_file_entity_source_field_config:video'
  media_migration_original_id: 'd7_file_entity:video:public'
process:
  track_changes_uuid:
    -
      plugin: migration_lookup
      source: fid
      migration:
        - upgrade_d7_file_entity_image_public
        - upgrade_d7_file_entity_default_public
        - upgrade_d7_file_entity_video_public
      no_stub: true
    -
      plugin: skip_on_empty
      method: process
    -
      plugin: migmag_get_entity_property
      entity_type_id: media
      property: uuid
  oracle_uuid:
    -
      plugin: media_migrate_uuid
      source: fid
  uuid:
    -
      plugin: null_coalesce
      source:
        - '@track_changes_uuid'
        - '@oracle_uuid'
  uid:
    -
      plugin: migration_lookup
      migration: upgrade_d7_user
      source: uid
    -
      plugin: default_value
      default_value: 1
  bundle:
    -
      plugin: get
      source: bundle
  name:
    -
      plugin: get
      source: filename
  created:
    -
      plugin: get
      source: timestamp
  status:
    -
      plugin: get
      source: status
  field_media_video_file/target_id:
    -
      plugin: get
      source: fid
  field_media_video_file/display:
    -
      plugin: get
      source: display
  field_media_video_file/description:
    -
      plugin: get
      source: description
  field_metatag:
    -
      plugin: d7_metatag_entities
      source: pseudo_metatag_entities
destination:
  plugin: 'entity:media'
migration_dependencies:
  required:
    - upgrade_d7_file_entity_type_video
    - upgrade_d7_file_entity_source_field_config_video
    - upgrade_d7_file
  optional:
    - upgrade_d7_user
