id: comp_page
label: 'comp page'
code: |-
  .ds-2col-stacked-fluid {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    margin-top: 20px;
  }



  .ds-2col-stacked-fluid > * {
    box-sizing: border-box;
  }

  .ds-2col-stacked-fluid > .group-left,
  .ds-2col-stacked-fluid > .group-right {
    width: 100%; /* Занимают всю ширину по умолчанию */
    margin-bottom: 10px; /* Отступ снизу */
  }

  @media (min-width: 768px) {
    .ds-2col-stacked-fluid {
      flex-direction: row;
      flex-wrap: wrap;
    }
    .ds-2col-stacked-fluid > .group-left,
    .ds-2col-stacked-fluid > .group-right {
      width: calc(50% - 10px);
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .ds-2col-stacked-fluid > .group-footer {
      width: 100%;
      margin-top: 10px;
    }
  }
  .ds-2col-stacked-fluid .group-footer table{
  	width: 100% !important;
  	border-collapse: separate;
  }


  .ds-2col-stacked-fluid .group-footer tr{
  	/*border-color: */
  	border-width: 0.3px;
  		/*border-style: none;*/
  }
  .ds-2col-stacked-fluid .group-footer td{
  	padding-left: 10px;
  }
  .ds-2col-stacked-fluid .group-footer thead,
  .ds-2col-stacked-fluid .group-footer tbody,
  .ds-2col-stacked-fluid .group-footer tfoot,
  .ds-2col-stacked-fluid .group-footer tr,
  .ds-2col-stacked-fluid .group-footer td,
  .ds-2col-stacked-fluid .group-footer th {
    border-color: inherit;
    border-style: solid;
    border-width: 1px;
  }
   

  #slick-2305babd9f6 img{
  	max-height: 360px;
    width: auto; /* Ширина автоматически подстраивается под высоту */
    display: block;
    margin: auto auto;
     /*  display: inline-block; /* Измените на inline-block */
     /* vertical-align: middle; /* Добавьте этот стиль */
  }
  #slick-2305babd9f6-nav .slick-list{
  	padding-top: 0;
  }

  #slick-2305babd9f6-nav img{
  	max-height: 110px;
    width: auto;
    padding: 0;
  }

  #slick-2305babd9f6-nav {
  	transition: transform 0.3s ease; /* Плавный переход */
  }  

  #slick-2305babd9f6-nav .slick-current{
  	border:  2px solid #5C6C81;
  	transform: scale(1.1); /* Увеличение на 10% */
  	transition: transform 0.3s ease; /* Плавный переход */

  }  

  #slick-2305babd9f6-nav .slick-slide[aria-hidden="true"] img{
    /* display: none !important; /* или visibility: hidden !important; */
   }
  #slick-2305babd9f6-nav .slick-slide img {
    /*  filter: brightness(0.5);Или другое значение яркости */
    opacity: 0.5;
    margin: 0 auto;
  }

  #slick-2305babd9f6-nav  .slick-slide.slick-current.slick-active img {
    /* filter: brightness(1); Полная яркость для активного слайда */
    transform: scale(1.1); /* Увеличение на 10% */
    opacity: 1;
  }

  #slick-2305babd9f6-nav .slick-track{
  	padding-top: 3px;
  }
     
