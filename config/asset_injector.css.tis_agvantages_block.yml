id: tis_agvantages_block
label: 'tis advantages block'
code: |-
  .tisadv {
      -webkit-text-size-adjust: 100%
  }

  .tisadv__iframe {
      z-index: 10000;
      background-color: #fff;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      border: 0
  }

  .tisadv__body_overflow_hidden {
      overflow: hidden
  }

  .tisadv__display_none {
      display: none
  }

  .tisadv__artboard {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden
  }

  .tisadv__artboard .tisadv__artboard_scale {
      overflow: visible
  }

  .tisadv__artboard.tisadv__artboard_scale .tisadv__elem[data-elem-type="text"] .tn-atom {
      word-break: normal;
      -moz-osx-font-smoothing: grayscale
  }

  .tisadv__artboard_scale .tisadv__carrier,
  .tisadv__artboard_scale .tisadv__filter {
      transform-origin: top left
  }

  .tn-atom__scale-wrapper {
      width: inherit;
      height: inherit
  }

  .tisadv__elem .tn-atom__scale-wrapper .tn-atom {
      width: inherit;
      height: inherit !important;
      box-sizing: border-box
  }

  .tisadv__artboard.rendering .tn-elem {
      visibility: hidden
  }

  .tisadv__artboard.rendered .tn-elem {
      visibility: visible
  }

  .tisadv__carrier {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 0;
      width: 100%;
      height: 100vh;
      -moz-transform: unset
  }

  .tisadv__filter {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      width: 100%;
      height: 100vh;
      transform: translateZ(0)
  }

  .tisadv__elem {
      position: absolute;
      box-sizing: border-box;
      display: table
  }

  .tisadv .tn-atom {
      display: table-cell;
      vertical-align: middle;
      width: 100%;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%
  }

  @media screen and (max-width:959px) {
      .tisadv_safari .tisadv__artboard_scale .tn-atom {
          -webkit-text-size-adjust: auto;
          -moz-text-size-adjust: auto;
          -ms-text-size-adjust: auto
      }
  }

  .tisadv .tn-atom ul,
  .tisadv .tn-atom ol {
      margin-bottom: 0
  }

  .tisadv_safari .tn-atom {
      transform: translateZ(0)
  }

  .tisadv a.tn-atom {
      text-decoration: none
  }

  .tisadv .tn-atom__img {
      width: 100%;
      display: block
  }

  .tisadv .tn-atom__html {
      vertical-align: top
  }

  .tisadv .tn-atom__pin {
      border-radius: 1000px;
      border-style: solid
  }

  .tisadv .tn-atom__pin_onclick {
      cursor: pointer
  }

  .tisadv .tn-atom__tip {
      position: absolute;
      box-sizing: border-box;
      width: 300px;
      max-width: 90vw;
      padding: 15px;
      display: none
  }

  .tisadv .tn-atom__pin:hover .tn-atom__tip {
      display: none
  }

  .tisadv .tn-atom__tip-img {
      width: 100%;
      display: block;
      margin-bottom: 10px
  }

  .tisadv .tn-atom__tip[data-tip-pos=top] {
      bottom: 100%;
      margin-bottom: 15px;
      left: 50%;
      transform: translateX(-50%)
  }

  .tisadv .tn-atom__tip[data-tip-pos=bottom] {
      top: 100%;
      margin-top: 15px;
      left: 50%;
      transform: translateX(-50%)
  }

  .tisadv .tn-atom__tip[data-tip-pos=left] {
      right: 100%;
      margin-right: 15px;
      top: 50%;
      transform: translateY(-50%)
  }

  .tisadv .tn-atom__tip[data-tip-pos=right] {
      left: 100%;
      margin-left: 15px;
      top: 50%;
      transform: translateY(-50%)
  }

  .tisadv__ui {
      position: absolute;
      top: 16px;
      left: 196px;
      background-color: #fa876b;
      color: #000 !important;
      height: 30px;
      line-height: 30px;
      width: 100px;
      z-index: 1000;
      text-align: center;
      border-radius: 3px;
      display: none;
      font-size: 14px
  }



  #tisadvantages .tisadv__artboard{height: 600px;background-color: #d9e3f1;}
  #tisadvantages .tisadv__filter{height: 600px;}
  #tisadvantages .tisadv__carrier{height: 600px;background-position: center center;background-attachment: scroll;background-size:cover;background-repeat:no-repeat;}
