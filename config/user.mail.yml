_core:
  default_config_hash: 6CZIzFifRq3qbdq3n3nDpEOO4hWIQtKOAQNPvGNGKeM
langcode: ru
cancel_confirm:
  subject: 'Удаление аккаунта [user:name]'
  body: "[user:name],\r\n\r\nВаша учетная запись на сайте [site:name] был удален.\r\n\r\n--  Администрация сайта [site:name]"
password_reset:
  subject: 'Восстановление аккаунта [user:name]'
  body: "[user:name], \r\n\r\nЗапрос на сброс пароля для вашего аккаунта был сделан на сайте [site:name]. \r\n\r\nВы можете сейчас войти на сайт, кликнув на ссылку или скопировав и вставив её в браузер: \r\n\r\n[user:one-time-login-url] \r\n\r\nЭто одноразовая ссылка для входа и она перебросит Вас на страницу, где Вы сможете изменить пароль. Ссылка истекает через 1 сутки и ничего не случится, если она не будет использована. \r\n\r\n-- Команда сайта [site:name]"
register_admin_created:
  subject: 'Создание аккаунта на сайте [site:name]'
  body: "[user:name], \r\n\r\nАдминистратор сайта [site:name] создал для вас аккаунт. Можете войти на сайт, кликнув на ссылку или скопировав и вставив её в адресную строку браузера:\r\n\r\n[user:one-time-login-url] \r\n\r\nЭта одноразовая ссылка для входа на сайт направит вас на страницу задания своего пароля.\r\n\r\nПосле установки пароля вы сможете входить на сайт через страницу [site:login-url] со следующими данными:\r\n\r\nпользователь: [user:name]\r\nпароль: ваш пароль \r\n\r\n-- Команда сайта [site:name]"
register_no_approval_required:
  subject: 'Создание аккаунта [user:name]'
  body: "[user:name], \r\n\r\nСпасибо за регистрацию на сайте [site:name]. Вы можете войти на сайт, кликнув на ссылку или скопировав и вставив её в Ваш браузер: \r\n\r\n[user:one-time-login-url] \r\n\r\nЭто одноразовая ссылка для входа и она перебросит Вас на страницу, где Вы сможете установить свой пароль. \r\n\r\nПосле установки Вашего пароля, вы сможете заходить на странице [site:login-url], используя:\r\n \r\nпользователь: [user:name] \r\nпароль: Ваш пароль \r\n\r\n-- Команда сайта [site:name]"
register_pending_approval:
  subject: 'Детали учётной записи [user:display-name] на сайте «[site:name]» (ожидает одобрения администратором)'
  body: "[user:name], \r\n\r\nСпасибо за регистрацию на сайте [site:name]. Ваша заявка на аккаунт в настоящее время ожидает подтверждения. Когда она будет принята, Вы получите другое сообщение, содержащее информацию о том, как войти, установить пароль и другую информацию. \r\n\r\n-- Команда сайта [site:name]"
register_pending_approval_admin:
  subject: 'Детали учётной записи [user:display-name] на сайте «[site:name]» (ожидает одобрения администратором)'
  body: "[user:display-name] подал заявку на получение учётной записи.\r\n\r\n[user:edit-url]"
status_activated:
  subject: 'Активирование аккаунта [user:name]'
  body: "[user:name], \r\n\r\nАктивирован ваш аккаунт на сайте [site:name].\r\n\r\nМожете войти на сайт, кликнув на ссылку или скопировав и вставив её в адресную строку браузера:\r\n\r\n[user:one-time-login-url] \r\n\r\nЭта одноразовая ссылка для входа на сайт направит вас на страницу задания своего пароля.\r\n\r\nПосле установки пароля вы сможете входить на сайт через страницу [site:login-url] со следующими данными: \r\n\r\nпользователь: [user:name] \r\nпароль: ваш пароль \r\n\r\n-- Команда сайта [site:name]"
status_blocked:
  subject: 'Блокирование аккаунта [user:name]'
  body: "[user:name],\r\n\r\nВаш аккаунт на сайте [site:name] был заблокирован.\r\n\r\n-- Администрация [site:name]"
status_canceled:
  subject: 'Детали учётной записи [user:display-name] на сайте «[site:name]» (удалено)'
  body: "[user:display-name],\r\n\r\nВаша учётная запись на сайте «[site:name]» удалена.\r\n\r\n-- Команда сайта «[site:name]»"
