id: podbor_servera
title: 'Подбор сервера по параметрам'
description: ''
categories: {  }
elements: |-
  formfaktor:
    '#type': webform_wizard_page
    '#title': 'Форм фактор'
    '#next_button_label': Вперед
    form_faktor:
      '#type': radios
      '#title': Форм-фактор
      '#multiple': false
      '#options':
        'Стойка (Rack)': 'Стойка (Rack)'
        ' Башня (Tower)': ' Башня (Tower)'
      '#options_display': side_by_side
      '#default_value': 'Стойка (Rack)'
      '#js_select': false
    vysota_v_yunitah:
      '#type': select
      '#title': 'Высота в юнитах'
      '#options':
        1U: 1U
        2U: 2U
        3U: 3U
        4U: 4U
      '#default_value': 1U
    form_faktor_nakopiteley_v_dyuymah:
      '#type': radios
      '#title': 'Форм-фактор накопителей в дюймах'
      '#multiple': false
      '#options':
        '2.5': '2.5'
        '3.5': '3.5'
      '#options_display': side_by_side
      '#default_value': '2.5'
      '#js_select': false
  processor:
    '#type': webform_wizard_page
    '#title': Процессор
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    kolichestvo_processorov:
      '#type': radios
      '#title': 'Количество процессоров'
      '#multiple': false
      '#options':
        1: '1'
        2: '2'
      '#options_display': side_by_side
      '#default_value': '2'
      '#js_select': false
    bazovaya_chastota_processora_v_ggc_ot:
      '#type': textfield
      '#title': 'Базовая частота процессора в ГГц, от'
    kolichestvo_yader_kazhdogo_processora:
      '#type': textfield
      '#title': 'Количество ядер каждого процессора'
  memory:
    '#type': webform_wizard_page
    '#title': Память
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    kolichestvo_otsekov_dlya_nakopiteley:
      '#type': select
      '#title': 'Количество отсеков для накопителей'
      '#options':
        4: '4'
        8: '8'
        10: '10'
        12: '12'
        16: '16'
        24: '24'
        36: '36'
        60: '60'
      '#default_value': '4'
    obem_operativnoy_pamyati_v_gb:
      '#type': textfield
      '#title': 'Объем оперативной памяти в ГБ'
  diski:
    '#type': webform_wizard_page
    '#title': Диски
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    tip_ustanovlennyh_nakopiteley:
      '#type': radios
      '#title': 'Тип установленных накопителей'
      '#multiple': false
      '#options':
        ' HDD': ' HDD'
        ' SSD SATA': ' SSD SATA'
        'SSD NVMe': 'SSD NVMe'
      '#options_display': side_by_side
      '#default_value': ' HDD'
      '#js_select': false
    kolichestvo_ustanovlennyh_nakopiteley:
      '#type': textfield
      '#title': 'Количество установленных накопителей'
    obem_kazhdogo_nakopitelya:
      '#type': textfield
      '#title': 'Объем каждого накопителя'
    ili_ukazhite_zhelaemyy_obshchiy_obem_diskovoy_podsistemy:
      '#type': textfield
      '#title': 'Или укажите желаемый общий объем дисковой подсистемы'
    nalichie_otdelnogo_nakopitelya_dlya_ustanovki_os:
      '#type': radios
      '#title': 'Наличие отдельного накопителя для установки ОС'
      '#multiple': false
      '#options':
        '1 шт': '1 шт'
        '2 шт': '2 шт'
        нет: нет
      '#options_display': side_by_side
      '#default_value': нет
      '#js_select': false
    nalichie_appratnogo_diskovogo_kontrollera:
      '#type': radios
      '#title': 'Наличие аппратного дискового контроллера'
      '#multiple': false
      '#options':
        Нет: Нет
        ' HBA': ' HBA'
        ' Raid': ' Raid'
      '#options_display': side_by_side
      '#default_value': Нет
      '#js_select': false
  setevoy_interfeys:
    '#type': webform_wizard_page
    '#title': 'Сетевой интерфейс'
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    tip_setevyh_interfeysov:
      '#type': radios
      '#title': 'Тип сетевых интерфейсов'
      '#multiple': false
      '#options':
        Медный: Медный
        Оптический: Оптический
      '#options_display': side_by_side
      '#default_value': Медный
      '#js_select': false
    kolichestvo_setevyh_portov:
      '#type': radios
      '#title': 'Количество сетевых портов'
      '#multiple': false
      '#options':
        2: '2'
        4: '4'
        8: '8'
      '#options_display': side_by_side
      '#default_value': '2'
      '#js_select': false
    skorost_setevyh_portov_gbit_sek:
      '#type': radios
      '#title': 'Скорость сетевых портов Гбит/сек'
      '#multiple': false
      '#options':
        1: '1'
        10: '10'
        25: '25'
        100: '100'
      '#options_display': side_by_side
      '#default_value': '1'
      '#js_select': false
    nalichie_adaptera_fibre_channel_dual_port:
      '#type': select
      '#title': 'Наличие адаптера Fibre Channel'
      '#options':
        нет: нет
        1х16G: 1х16G
        2х16G: 2х16G
        1х32G: 1х32G
        2х32G: 2х32G
      '#default_value': нет
  opcii:
    '#type': webform_wizard_page
    '#title': Опции
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    nalichie_otkazoustoychivogo_bloka_pitaniya:
      '#type': radios
      '#title': 'Наличие отказоустойчивого блока питания'
      '#multiple': false
      '#options':
        Да: Да
        Нет: Нет
      '#options_display': side_by_side
      '#default_value': Да
      '#js_select': false
    dopolnitelnye_kommentarii:
      '#type': textarea
      '#title': 'Дополнительные требования и комментарии'
  contacts:
    '#type': webform_wizard_page
    '#title': 'Ваши контакты'
    '#open': true
    '#prev_button_label': Назад
    '#next_button_label': Вперед
    imya_i_familiya:
      '#type': textfield
      '#title': 'Имя и Фамилия'
      '#placeholder': 'Ваше имя'
      '#wrapper_attributes':
        class:
          - bs-mt-2
      '#required': true
    e_mail:
      '#type': email
      '#title': E-mail
      '#placeholder': 'Ваша почта'
      '#wrapper_attributes':
        class:
          - bs-mt-2
      '#required': true
    telefon:
      '#type': tel
      '#title': Телефон
      '#placeholder': 'Ваш телефон'
      '#input_mask': +7(999)999-9999
      '#wrapper_attributes':
        class:
          - 'container-inline clearfix'
          - bs-mt-2
      '#label_attributes':
        class:
          - bs-mr-2
      '#phone__help': 'Укажите Ваш номер телефона, пожалуйста'
    agreement_call_back:
      '#type': checkbox
      '#title': 'Согласен на получение обратного звонка и обработку моего номера телефона в целях консультации.'
      '#states':
        visible:
          ':input[name="telefon"]':
            filled: true
        required:
          ':input[name="telefon"]':
            filled: true
      '#wrapper_attributes':
        class:
          - mt-3
          - mb-5
    agreement:
      '#type': checkbox
      '#title': 'Согласен на обработку персональных данных'
      '#description': '<p>Отправляя данную форму, я подтверждаю, что ознакомлен(а) с <a class="color-tis-orange" style="color:#FF820E !important;" href="/politika-v-otnoshenii-obrabotki-personalnykh-dannykh" target="_blank">Политикой в отношении обработки персональных данных </a>и даю свое <a class="color-tis-orange" style="color:#FF820E !important;" href="/content/soglasie-na-obrabotku-personalnykh-dannykh">Согласие на обработку персональных данных</a>, в соответствии с требованиями Федерального закона № 152-ФЗ «О персональных данных».</p>'
      '#required': true
      '#default_value': true
      '#wrapper_attributes':
        class:
          - bs-mt-3
