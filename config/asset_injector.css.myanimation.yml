  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }
  section {
    height: 300px;
    position: relative;
  }

  .tis-animation{
      color: #ffffff;
      font-size: 37px;
      font-family: 'Montserrat', Arial, sans-serif;
      line-height: 1.55;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
  }






  .clouds div  {
    position: absolute;
    top: 0;
  }
  .clouds div.cloud1 {
    top: 30px;
    animation: cloud1 45s linear 1s infinite;
    opacity: 0
  }
  @keyframes cloud1 {
    0% {
      opacity: 0;
      right: 0
    }
    10% {
      opacity: 1;
      right: 70px
    }
    90% {
      opacity: 1;
      right: 1000px
    }
    100% {
      opacity: 0;
      right: 1088px
    }
  }
