id: podbor_servera_po_zadacham
title: 'Подбор сервера по задачам'
description: ''
categories: {  }
elements: |-
  zadacha_servera:
    '#type': checkboxes
    '#title': 'Задача сервера'
    '#options':
      'Сервер DNS/DHCP': 'Сервер DNS/DHCP'
      'Контроллер домена (AD)': 'Контроллер домена (AD)'
      'Сервер VPN': 'Сервер VPN'
      'Терминальный сервер': 'Терминальный сервер'
      'Файловый сервер/ Сервер для 1С (DBF)': 'Файловый сервер/ Сервер для 1С (DBF)'
      'Почтовый сервер': 'Почтовый сервер'
      'Сервер баз данных': 'Сервер баз данных'
      'Сервер для 1С (SQL)': 'Сервер для 1С (SQL)'
      'Сервер виртуализации': 'Сервер виртуализации'
      Web-сервер: Web-сервер
      'Сервер для видеонаблюдения': 'Сервер для видеонаблюдения'
      'Сервер CRM/ERP': 'Сервер CRM/ERP'
      'Virtual Desktop сервер (VDI)': 'Virtual Desktop сервер (VDI)'
      'Virtual Storage сервер (VSA)': 'Virtual Storage сервер (VSA)'
  kolichestvo_klientov:
    '#type': radios
    '#title': 'Количество клиентов'
    '#options':
      'До 10 клиентов': 'До 10 клиентов'
      'До 25 клиентов': 'До 25 клиентов'
      'До 50 клиентов': 'До 50 клиентов'
      'До 150 клиентов': 'До 150 клиентов'
      'До 500 клиентов': 'До 500 клиентов'
      'От 500 клиентов': 'От 500 клиентов'
  form_faktor:
    '#type': radios
    '#title': 'Форм фактор'
    '#options':
      'Настольное исполнение': 'Настольное исполнение'
      'Стоечное исполнение': 'Стоечное исполнение'
  primernyy_byudzhet_servera:
    '#type': textfield
    '#title': 'Примерный бюджет сервера'
    '#more_title': 'Укажите примерный бюджет сервера'
  dopolnitelnye_kommentarii:
    '#type': textarea
    '#title': 'Дополнительные комментарии'
    '#wrapper_attributes':
      class:
        - bs-mt-2
  contacts:
    '#type': webform_flexbox
    imya_i_familiya:
      '#type': textfield
      '#title': 'Имя и Фамилия'
      '#placeholder': 'Ваше имя'
      '#wrapper_attributes':
        class:
          - bs-mt-2
      '#required': true
    prosto_telefon:
      '#type': tel
      '#title': 'Ваш телефон'
      '#placeholder': 'Ваш телефон'
      '#input_mask': +7(999)999-9999
      '#telephone_validation_format': '2'
      '#telephone_validation_country': RU
      '#wrapper_attributes':
        class:
          - bs-mt-2
    e_mail:
      '#type': email
      '#title': E-mail
      '#placeholder': 'Ваша почта'
      '#default_value': '[current-user:mail]'
      '#required': true
      '#wrapper_attributes':
        class:
          - bs-mt-2
    agreement:
      '#type': checkbox
      '#title': 'Согласен на обработку персональных данных'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;color:rgb(0, 0, 0);display:inline !important;float:none;font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Даю согласие на&nbsp;обработку и хранение персональных </span><a class="color-tis-orange" style="border-bottom-color:rgb(255, 53, 3);border-bottom-style:solid;border-image:initial;border-left-color:initial;border-left-style:initial;border-right-color:initial;border-right-style:initial;border-top-color:initial;border-top-style:initial;border-width:0px;box-sizing:content-box;color:rgb(0, 86, 211);font-weight:inherit;margin:0px;outline:none;padding:0px;text-decoration:none;" href="/agreement" target="_blank" rel="noreferrer noopener"><em style="-webkit-text-stroke-width:0px;box-sizing:content-box;color:rgb(255, 130, 14);font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">данных</em></a><br><span style="-webkit-text-stroke-width:0px;color:rgb(0, 0, 0);display:inline !important;float:none;font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">и принимаю </span><a class="color-tis-orange" style="border-bottom-color:rgb(255, 53, 3);border-bottom-style:solid;border-image:initial;border-left-color:initial;border-left-style:initial;border-right-color:initial;border-right-style:initial;border-top-color:initial;border-top-style:initial;border-width:0px;box-sizing:content-box;color:rgb(255, 130, 14);font-weight:inherit;margin:0px;outline:none;padding:0px;text-decoration:none;" href="/agreement" target="_blank" rel="noreferrer noopener"><em style="-webkit-text-stroke-width:0px;box-sizing:content-box;color:rgb(255, 130, 14);font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">соглашение</em></a><em style="-webkit-text-stroke-width:0px;box-sizing:content-box;color:rgb(0, 0, 0);font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> </em><span style="-webkit-text-stroke-width:0px;color:rgb(0, 0, 0);display:inline !important;float:none;font-family:GraphikTT, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:center;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">c политикой конфиденциальности</span></p>'
      '#required': true
      '#default_value': true
      '#wrapper_attributes':
        class:
          - bs-mt-3
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      visible:
        ':input[name="e_mail"]':
          filled: true
        ':input[name="agreement"]':
