services:
  server_configurator.page_context:
    class: Drupal\server_configurator\Context\PageContext
    arguments:
      - '@current_route_match'

  server_configurator.server_data:
    class: Drupal\server_configurator\Data\ServerDataProvider
    arguments:
      - '@current_route_match'

  server_configurator.platform_data:
    class: Drupal\server_configurator\Data\PlatformDataProvider
    arguments:
      - '@current_route_match'

  server_configurator.attachments_builder:
    class: Drupal\server_configurator\Presentation\ConfiguratorAttachmentBuilder
    arguments:
      - '@server_configurator.page_context'
      - '@server_configurator.server_data'
      - '@server_configurator.platform_data'

