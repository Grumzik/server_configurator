services:
  server_configurator.page_context:
    class: Drupal\server_configurator\Context\PageContextFetcher
    arguments:
      - '@current_route_match'

  server_configurator.configurator_context_resolver:
    class: Drupal\server_configurator\Context\ConfiguratorContextResolver
    arguments:
      - '@server_configurator.page_context'

  server_configurator.server_data:
    class: Drupal\server_configurator\Data\ServerDataProvider
    arguments:
      - '@current_route_match'

  server_configurator.platform_data:
    class: Drupal\server_configurator\Data\PlatformDataProvider
    arguments:
      - '@current_route_match'
      - '@entity_type.manager'

  server_configurator.drupal_settings_builder:
    class: Drupal\server_configurator\Application\ConfiguratorDrupalSettingsBuilder
    arguments:
      - '@server_configurator.page_context'
      - '@server_configurator.server_data'
      - '@server_configurator.platform_data'

  server_configurator.bootstrap_manager:
    class: Drupal\server_configurator\Application\ConfiguratorBootstrapManager
    arguments:
      - '@server_configurator.configurator_context_resolver'
      - '@server_configurator.drupal_settings_builder'

  server_configurator.field_locator:
    class: Drupal\server_configurator\Service\ConfiguratorFieldLocator

  server_configurator.platform_repository:
    class: Drupal\server_configurator\Repository\PlatformRepository
    arguments:
      - '@entity_type.manager'

  server_configurator.server_repository:
    class: Drupal\server_configurator\Repository\ServerRepository
    arguments:
      - '@entity_type.manager'

  server_configurator.options_builder:
    class: Drupal\server_configurator\Service\ConfiguratorOptionsBuilder
    arguments:
      - '@server_configurator.platform_repository'
      - '@server_configurator.server_repository'

  server_configurator.dependencies_feature:
    class: Drupal\server_configurator\Feature\DependenciesFeature
    arguments:
      - '@server_configurator.field_locator'
      - '@server_configurator.options_builder'

  server_configurator.processors_feature:
    class: Drupal\server_configurator\Feature\ProcessorsFeature
    arguments:
      - '@server_configurator.field_locator'
      - '@renderer'
      - '@server_configurator.configurator_context_resolver'

  server_configurator.storage_feature:
    class: Drupal\server_configurator\Feature\StorageFeature

  server_configurator.summary_feature:
    class: Drupal\server_configurator\Feature\SummaryFeature

  server_configurator.form_alter:
    class: Drupal\server_configurator\Application\ConfiguratorFormAlter
    arguments:
      - '@server_configurator.configurator_context_resolver'
      - '@server_configurator.bootstrap_manager'
      - '@server_configurator.dependencies_feature'
      - '@server_configurator.processors_feature'
      - '@server_configurator.storage_feature'
