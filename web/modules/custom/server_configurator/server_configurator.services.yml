services:
  server_configurator.page_context:
    class: Drupal\server_configurator\Context\PageContextFetcher
    arguments:
      - '@current_route_match'

  server_configurator.configurator_context_resolver:
    class: Drupal\server_configurator\Context\ConfiguratorContextResolver
    arguments:
      - '@server_configurator.page_context'

  server_configurator.server_data:
    class: Drupal\server_configurator\Data\ServerDataProvider
    arguments:
      - '@current_route_match'

  server_configurator.platform_data:
    class: Drupal\server_configurator\Data\PlatformDataProvider
    arguments:
      - '@current_route_match'
      - '@entity_type.manager'

  server_configurator.drupal_settings_builder:
    class: Drupal\server_configurator\Service\ConfiguratorDrupalSettingsBuilder
    arguments:
      - '@server_configurator.page_context'
      - '@server_configurator.server_data'
      - '@server_configurator.platform_data'

  server_configurator.bootstrap_manager:
    class: Drupal\server_configurator\Service\ConfiguratorBootstrapManager
    arguments:
      - '@server_configurator.configurator_context_resolver'
      - '@server_configurator.drupal_settings_builder'

  server_configurator.field_locator:
    class: Drupal\server_configurator\Service\ConfiguratorFieldLocator

  server_configurator.main_dependencies:
    class: Drupal\server_configurator\Form\MainConfiguratorDependencyFeature
    arguments:
      - '@server_configurator.field_locator'

  server_configurator.main_processors:
    class: Drupal\server_configurator\Form\MainConfiguratorProcessorFeature
    arguments:
      - '@server_configurator.field_locator'
      - '@renderer'

  server_configurator.main_form_alter:
    class: Drupal\server_configurator\Form\MainConfiguratorFormAlter
    arguments:
      - '@server_configurator.bootstrap_manager'
      - '@server_configurator.field_locator'
      - '@server_configurator.main_dependencies'
      - '@server_configurator.main_processors'

  server_configurator.form_alter_router:
    class: Drupal\server_configurator\Service\FormAlterRouter
    arguments:
      - '@server_configurator.configurator_context_resolver'
      - '@server_configurator.main_form_alter'
